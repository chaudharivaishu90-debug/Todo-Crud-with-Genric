
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Golden Crumb Cafe | Menu</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <!-- Bootstrap CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
        crossorigin="anonymous">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div>
            <h2 class="bg-dark text-white text-center py-3">
                <img
                    src="https://cdn-icons-png.flaticon.com/128/6774/6774898.png"
                    alt="Cafe Logo"
                    width="45">
                The Golden Crumb Cafe
            </h2>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container-fluid mt-5">
        <div class="row">

            <!-- Left Side: Menu Form -->
            <div class="col-md-3 col-sm-12 mb-4">

                <div class="card-header text-center"
                    style="font-style: italic;">

                    <h3>
                        <img
                            src="https://cdn-icons-png.flaticon.com/128/4574/4574657.png"
                            alt="Menu Icon"
                            width="35">
                        Menu Card
                    </h3>

                </div>

                <div class="card">

                    <form id="form">

                        <div class="card-body">

                            <!-- Item Name -->
                            <div class="form-group">
                                <label for="Item">Item Name</label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="Item"
                                    placeholder="Enter item name"
                                    required>
                            </div>

                            <!-- Price -->
                            <div class="form-group">
                                <label for="Price">
                                    Price
                                    (<i class="fa-solid fa-indian-rupee-sign"></i>)
                                </label>

                                <input
                                    type="number"
                                    class="form-control"
                                    id="Price"
                                    placeholder="Enter price"
                                    min="0"
                                    required>
                            </div>

                            <!-- Image URL -->
                            <div class="form-group">
                                <label for="Image">Image URL</label>

                                <input
                                    type="url"
                                    class="form-control"
                                    id="Image"
                                    placeholder="Paste image URL"
                                    required>
                            </div>

                            <!-- Add Button -->
                            <button
                                type="submit"
                                class="btn btn-sm btn-block bg-dark text-white"
                                style="font-weight: 500; font-style: italic;"
                                id="Add"><i class="fa-solid fa-plus"></i> Add Menu</button>

                            <button
                                type="button"
                                class="btn btn-sm btn-block bg-dark text-white d-none"
                                style="font-weight: 500; font-style: italic;"
                                id="Update">

                                <i class="fa-solid fa-pen-to-square"></i>Update Menu</button>

                        </div>

                    </form>

                </div>

            </div>

            <div class="col-md-9 col-sm-12">

                <div class="row" id="MenuContainer">


                </div>

            </div>

        </div>
    </div>

    <!-- Spinner -->
    <div class="spinner d-none" id="spinner">

        <div class="spinner-border text-danger" role="status">
            <span class="sr-only">Loading...</span>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="./assets/js/app.js"></script>

</body>

</html>
```
